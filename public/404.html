<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · SponsrMitra</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E7DCC3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%236A231A'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='%23A83A2D'/%3E%3Ccircle cx='13' cy='13' r='4' fill='%23D85A4C'/%3E%3C/svg%3E">
<script>
  try { var t = localStorage.getItem('sponsrmitra.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* storage blocked */ }
</script>
<script src="/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--paper:#E7DCC3;--card:#FFFCF4;--ink:#221F1A;--ink2:#5A5445;--line:rgba(34,31,26,.14);--mari:#D9761C;--mari-ink:#1c1206;--brick:#A83A2D;--shadow:0 14px 30px -18px rgba(34,31,26,.45)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#16130F;--card:#26211A;--ink:#EFE6D3;--ink2:#C9BEA6;--line:rgba(239,230,211,.15);--mari:#EB9A4C;--brick:#DA7A6B;--shadow:0 14px 30px -16px rgba(0,0,0,.75)}}
:root[data-theme="dark"]{--paper:#16130F;--card:#26211A;--ink:#EFE6D3;--ink2:#C9BEA6;--line:rgba(239,230,211,.15);--mari:#EB9A4C;--brick:#DA7A6B;--shadow:0 14px 30px -16px rgba(0,0,0,.75)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--paper);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.6;background-image:radial-gradient(rgba(34,31,26,.05) 1px,transparent 1.2px);background-size:5px 5px}
.card{position:relative;max-width:520px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:40px 28px 32px;box-shadow:var(--shadow);transform:rotate(-.6deg);text-align:center}
.tape{position:absolute;top:-11px;left:50%;margin-left:-38px;width:76px;height:22px;background:var(--mari);opacity:.85;transform:rotate(-4deg);border-radius:2px}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:18px;text-decoration:none;color:inherit}
.pin{width:12px;height:12px;border-radius:50%;background:var(--brick);box-shadow:0 2px 3px rgba(0,0,0,.35)}
h1{font-family:"Space Grotesk",sans-serif;font-size:30px;letter-spacing:-.02em;line-height:1.15;margin-top:20px}
p{color:var(--ink2);margin-top:10px}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:14px;font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:16px;text-decoration:none;border:1.5px solid transparent}
.btn.primary{background:var(--mari);color:var(--mari-ink)}
.btn.ghost{border-color:var(--ink);color:var(--ink)}
a:focus-visible{outline:3px solid var(--mari);outline-offset:3px}
.small{font-size:15px;margin-top:20px}
.small a{color:inherit}
@media (prefers-reduced-motion:reduce){.card{transform:none}}
</style>
</head>
<body>
<main class="card">
  <span class="tape" aria-hidden="true"></span>
  <a class="brand" href="/"><span class="pin" aria-hidden="true"></span>SponsrMitra</a>
  <h1>Page not found</h1>
  <p>This page doesn’t exist or has moved. Check the address, or go back to the start.</p>
  <div class="btns">
    <a class="btn primary" href="/">Go to the home page</a>
    <a class="btn ghost" href="/app/">Open the app</a>
  </div>
  <p class="small" id="contact" hidden></p>
</main>
<script>
(function () {
  var CFG = window.SPONSRMITRA_CONFIG || {};
  var email = typeof CFG.contactEmail === 'string' && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(CFG.contactEmail.trim()) ? CFG.contactEmail.trim() : '';
  if (!email) return;
  var p = document.getElementById('contact'), a = document.createElement('a');
  a.href = 'mailto:' + email; a.textContent = 'write to us';
  p.appendChild(document.createTextNode('Still stuck? You can ')); p.appendChild(a); p.appendChild(document.createTextNode('.'));
  p.hidden = false;
})();
</script>
</body>
</html>
