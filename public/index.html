<style>

    --shadow:0 10px 24px -14px rgba(0,0,0,.7); --hold:#8F7650; --overlay:rgba(0,0,0,.62); --av-ink:#F3C08B; --mari-pill:#F3C08B;
  }
}
:root[data-theme="dark"]{
  --bgdesk:#0F0D0A; --bg:#1B1712; --card:#26211A; --ink:#EFE6D3; --ink2:#C9BEA6; --line:rgba(239,230,211,.14);
  --mari:#EB9A4C; --mari-soft:#4A3320; --teal:#5AAC9F; --teal-soft:#20403B; --brick:#DA7A6B; --brick-soft:#4A2622;

<script>
/* ===== SponsrMitra data layer ===== */
const CFG = window.SPONSRMITRA_CONFIG || {};
const SERVER = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
// Sample people and companies exist only in the separate demo build, which sets this flag.
const DEMO_OK = !SERVER && !!window.SPONSRMITRA_DEMO;
const KEY = 'sponsrmitra.app.v2';
const VERSION = 2;
const DAY = 86400000;
const HOUR = 3600000;
const T0 = Date.now();
const ago = (d) => T0 - d * DAY;
const ahead = (d) => T0 + d * DAY;
const uid = (p) => p + Array.from((window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(8)) : Array.from({ length: 8 }, () => Math.floor(Math.random() * 256)), (b) => b.toString(16).padStart(2, '0')).join('');

const FEST_TYPES = ['Technical', 'Cultural', 'Management', 'Sports', 'Society or department'];
const SIZE_BANDS = [
  { k: 'xs', label: 'Under 1K', mult: 0.25, nm: 0.4 },
  { k: 's', label: '1K to 3K', mult: 0.55, nm: 0.8 },
  { k: 'm', label: '3K to 5K', mult: 1, nm: 1 },
  { k: 'l', label: '5K and above', mult: 1.6, nm: 1.1 },
];
const TYPE_MULT = { 'Technical': 1, 'Cultural': 1.25, 'Management': 0.9, 'Sports': 0.7, 'Society or department': 0.4 };
const CATS = [
  { k: 'title', label: 'Title sponsor', lo: 2, hi: 4, n: 14, tier: true },
  { k: 'tech', label: 'Tech and recruiters', lo: 1.5, hi: 3, n: 9 },
  { k: 'bev', label: 'Beverages and FMCG', lo: 1, hi: 2.5, n: 11 },
  { k: 'local', label: 'Local and in-kind', lo: 0.4, hi: 1.2, n: 18 },
  { k: 'bank', label: 'Banking and fintech', lo: 1, hi: 2, n: 3 },
  { k: 'app', label: 'Apparel and sports', lo: 0.8, hi: 1.8, n: 6 },
  { k: 'edu', label: 'Education', lo: 0.6, hi: 1.5, n: 7 },
  { k: 'media', label: 'Media partners', lo: 0.3, hi: 0.8, n: 5 },
];
const CAT_LABEL = Object.fromEntries(CATS.map((c) => [c.k, c.label]));
const MIN_SAMPLE = 5;
const STAGES = [
  ['shortlisted', 'Shortlisted'], ['intro', 'Intro requested'], ['contacted', 'Contacted'], ['replied', 'Replied'],
  ['meeting', 'Meeting booked'], ['negotiating', 'Negotiating'], ['committed', 'Committed'], ['declined', 'Declined'],
];
const STAGE_LABEL = Object.fromEntries(STAGES);
const HOPED = ['shortlisted', 'intro', 'contacted', 'replied'];
const LIKELY = ['meeting', 'negotiating'];
const DECLINE_REASONS = ['Budget is used up', 'Timing does not work', 'Not a fit for our category', 'No response after follow-ups', 'Other'];
const VERIFY_METHODS = {
  fest: ['College email check and faculty confirmation', 'Student affairs office confirmation'],
  company: ['Test email delivered', 'Phone call to the contact', 'Confirmation from the brand'],
  alumni: ['College alumni records', 'LinkedIn profile check'],
};

const round2 = (n) => Math.round(n * 100) / 100;
function sizeBand(visitors) {
  return visitors < 1000 ? 'xs' : visitors < 3000 ? 's' : visitors < 5000 ? 'm' : 'l';
}
function festScale(type, size) {
  return (TYPE_MULT[type] || 1) * SIZE_BANDS.find((s) => s.k === size).mult;
}
function bench(type, size, cat) {
  if (SERVER) { const b = (S.benchmarks || {})[type + '|' + size + '|' + cat]; return b ? { lo: +b.lo, hi: +b.hi, n: +b.n } : { lo: 0, hi: 0, n: 0 }; }
  const c = CATS.find((x) => x.k === cat);
  const b = SIZE_BANDS.find((s) => s.k === size);
  const m = (TYPE_MULT[type] || 1) * b.mult;
  const nm = b.nm * (type === 'Technical' ? 1 : 0.8);

    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { cur.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; cur.push(f); rows.push(cur); cur = []; f = ''; }
    else f += ch;
  }
  if (f.length || cur.length) { cur.push(f); rows.push(cur); }
  return rows.filter((r) => r.some((x) => x.trim()));
}

/* ===== Live backend (Supabase) ===== */
let sb = null;
const SYNC = { chain: Promise.resolve(), pending: 0, vers: {}, sig: '' };
const SYNC_KINDS = ['fests', 'companies', 'alumni', 'pipeline', 'shortlists', 'archive', 'reports'];
const SNAP_KEYS = ['fests', 'companies', 'alumni', 'pipeline', 'shortlists', 'intros', 'requests', 'archive', 'reports', 'audit'];

function friendly(err) {
  const m = String((err && err.message) || err || 'Something went wrong');
  if (m === 'conflict') return 'Someone else just changed this. We refreshed it for you.';
  if (/jwt|expired|not authenticated|Sign in first/i.test(m)) return 'Please sign in again.';
  if (/Failed to fetch|NetworkError|network/i.test(m)) return 'No connection. Check your internet and try again.';
  return m;
}
function stripV(o) { const c = Object.assign({}, o); delete c._v; return c; }
function syncSnapshot() {
  const m = {};
  SYNC_KINDS.forEach((k) => (S[k] || []).forEach((x) => { m[k + '|' + x.id] = JSON.stringify(stripV(x)); }));
  return m;
}
function pushChanges(before) {
  const after = syncSnapshot(), byKey = {}, changes = [];
  SYNC_KINDS.forEach((k) => (S[k] || []).forEach((x) => { byKey[k + '|' + x.id] = x; }));
  Object.keys(after).forEach((key) => {
    if (before[key] !== after[key]) { const p = key.split('|'); changes.push({ kind: p[0], id: p[1], op: 'upsert', data: stripV(byKey[key]) }); }
  });
  Object.keys(before).forEach((key) => {
    if (!(key in after)) { const p = key.split('|'); changes.push({ kind: p[0], id: p[1], op: 'delete' }); }
  });
  if (!changes.length) return;
  SYNC.pending++;
  SYNC.chain = SYNC.chain.then(() => sendChanges(changes)).catch(() => {}).then(() => { SYNC.pending--; if (SYNC.pending === 0) refresh(); });
}
async function sendChanges(changes) {
  const payload = changes.map((c) => ({ kind: c.kind, id: c.id, op: c.op, data: c.data, baseV: SYNC.vers[c.kind + '|' + c.id] || 0 }));
  const res = await sb.rpc('apply_changes', { changes: payload });
  if (res.error) { toast(friendly(res.error)); throw res.error; }
  const v = (res.data && res.data.versions) || {};
  Object.keys(v).forEach((k) => { if (v[k] === 0) delete SYNC.vers[k]; else SYNC.vers[k] = v[k]; });
}
async function rpcCall(name, args) {
  await SYNC.chain.catch(() => {});
  const res = await sb.rpc(name, args || {});
  if (res.error) throw res.error;
  return res.data;
}
/* run a server action, then refresh and report */
async function serverDo(name, args, okMsg, after) {
  try {
    const data = await rpcCall(name, args);
    await refresh();
    if (okMsg) toast(okMsg);
    if (after) after(data);
    return data;
  } catch (e) { toast(friendly(e)); await refresh(true); return null; }
}
async function serverRegister(name, p, okMsg) {
  try {
    await rpcCall(name, { p });
    ui.sheet = null; await refresh();
    toast(okMsg); go(defaultHash(me()));
  } catch (e) { toast(friendly(e)); }
}
function clearServerState() {
  SNAP_KEYS.forEach((k) => { S[k] = []; });
  S.users = []; S.notifs = []; S.benchmarks = {}; S.session.userId = null; SYNC.vers = {}; SYNC.sig = ''; ui.noProfile = false;
}
function applySnapshot(d) {
  if (!d || !d.profile) { clearServerState(); ui.noProfile = true; return; }
  ui.noProfile = false;
  S.session.userId = d.profile.id;
  S.users = (d.users || []).slice();
  if (!S.users.some((u) => u.id === d.profile.id)) S.users.push(d.profile);
  SNAP_KEYS.forEach((k) => { S[k] = d[k] || []; });
  S.notifs = d.notifs || [];
  S.benchmarks = {};
  (d.benchmarks || []).forEach((b) => { S.benchmarks[b.type + '|' + b.size + '|' + b.cat] = b; });
  SYNC.vers = {};
  SYNC_KINDS.forEach((k) => S[k].forEach((x) => { SYNC.vers[k + '|' + x.id] = x._v; }));
}
async function refresh(quiet) {
  if (!sb || !ui.sbSession) return;
  if (quiet && SYNC.pending > 0) return;
  const res = await sb.rpc('bootstrap');
  if (res.error) { if (!quiet || /jwt|expired/i.test(res.error.message || '')) toast(friendly(res.error)); return; }
  const sig = JSON.stringify(res.data, (k, v) => (k === 'serverTime' ? undefined : v));
  if (quiet && sig === SYNC.sig) return;
  if (SYNC.pending > 0) return;
  SYNC.sig = sig;
  applySnapshot(res.data);
  render();
}

function nextActions(f) {
  const out = [], ps = festPipeline(f.id), now = Date.now();
  ps.filter((p) => !['committed', 'declined'].includes(p.stage) && p.followUp && p.followUp <= now + DAY / 2).forEach((p) => {
    out.push({ cls: 'bk', icon: 'clock', title: 'Follow up with ' + C(p.companyId).name, sub: (p.followUp <= now ? 'Due today' : 'Due ' + inText(p.followUp)) + ', last touch ' + agoText(p.lastTouch), href: '#/pipe/' + p.id });
  });
  S.intros.filter((i) => i.festId === f.id && i.status === 'accepted').forEach((i) => {
    const p = stageOfFest(f.id, i.companyId);
    if (p && p.stage === 'intro' && !p.deckSent) out.push({ cls: 'tl', icon: 'check', title: C(i.companyId).name + ' intro accepted', sub: 'Send your deck to ' + C(i.companyId).contact.name, href: '#/pipe/' + p.id });
  });
  if (!proofComplete(f)) out.push({ cls: 'am', icon: 'alert', title: 'Proof pack is incomplete', sub: 'Add footfall photos before your next pitch', href: '#/proof' });
  ps.filter((p) => p.stage === 'committed').forEach((p) => {
    p.payments.filter((x) => !x.paid && x.due - now < 30 * DAY).forEach((x) => out.push({ cls: 'am', icon: 'clock', title: 'Payment due from ' + C(p.companyId).name, sub: money(x.amount) + ' ' + inText(x.due), href: '#/deal/' + p.id }));

  });
  return out.slice(0, 4);
}

V.planner = () => {

  const pl = ui.forms.pl, tb = totalBench(pl.type, pl.size), tgt = +pl.target || 0;
  const lo = tb.lo * 100000, hi = tb.hi * 100000, enough = tb.n >= MIN_SAMPLE;
  const max = Math.max(hi * 1.25, tgt * 1.1, 1);
  const status = !tgt ? '' : tgt < lo ? pill('Below range', 'amber') : tgt > hi ? pill('Above range', 'brick') : pill('Within range', 'teal');
  const sb = SIZE_BANDS.find((s) => s.k === pl.size);
  const catRows = CATS.map((c) => {
    const b = bench(pl.type, pl.size, c.k);
    if (b.n < MIN_SAMPLE) return '<div class="mt12"><div class="row between"><span class="sg" style="font-weight:600;font-size:14px">' + c.label + '</span><span class="cap">Not enough data yet (' + b.n + ' fests)</span></div><div class="rbar mt8"></div></div>';
    const mx = 5 * Math.max(1, festScale(pl.type, pl.size));
    return '<div class="mt12"><div class="row between"><span class="sg" style="font-weight:600;font-size:14px">' + c.label + '</span><span class="cap" style="color:var(--ink)">' + lk(b.lo) + ' to ' + lk(b.hi) + '</span></div><div class="rbar mt8"><i style="left:' + b.lo / mx * 100 + '%;width:' + (b.hi - b.lo) / mx * 100 + '%"></i></div></div>';
  }).join('');
  return page(appbar('Target planner', { back: '#/home' }) + '<div class="pad">' +
    '<div class="row g8 mt4"><div class="f1">' + sel('pl.type', FEST_TYPES, { rerender: true }) + '</div><div class="f1">' + sel('pl.size', SIZE_BANDS.map((s) => [s.k, s.label + ' visitors']), { rerender: true }) + '</div></div>' +
    '<div class="card mt16"><div class="cap">Comparable fests raised in total</div>' +
    (enough ? '<div class="big mt4">' + lk(tb.lo) + ' to ' + lk(tb.hi) + '</div><div class="note mt8">Based on ' + tb.n + ' fests of similar size and type. Ranges only, never one fest’s private figure.</div>' : '<div class="big sm mt4">Not enough data yet</div><div class="note mt8">Only ' + tb.n + ' comparable fests so far. We show a range once at least ' + MIN_SAMPLE + ' have shared theirs.</div>') + '</div>' +
    (f.contributed ? '<div class="card mt16"><div class="cap">By sponsor type, cash and in-kind value</div>' + catRows + '</div>'
      : '<div class="card mt16"><div class="h3">Unlock the breakdown by sponsor type</div><p class="note mt8">Share what your fest raised last year, by sponsor type, and see how much each kind of sponsor typically gives. Only ranges are ever shown to others.</p><button class="btn primary mt12" data-act="openContrib">Add my numbers</button></div>') +
    '<div class="card mt16"><div class="row between"><div><div class="cap">Your target</div></div>' + status + '</div>' +
    '<div class="mt8">' + inp('pl.target', { type: 'number', ph: 'e.g. 1200000', rerender: true, min: 0 }) + '</div>' +
    (enough && tgt ? '<div class="rbar mt20"><i style="left:' + lo / max * 100 + '%;width:' + (hi - lo) / max * 100 + '%"></i><span class="mk" style="left:' + Math.min(99, tgt / max * 100) + '%;background:var(--mari);width:5px"></span></div><div class="note mt12">' + (tgt < lo ? 'Below what similar fests raised. You may be able to aim higher.' : tgt > hi ? 'Above what similar fests raised. Plan for a stronger title sponsor.' : 'In the ' + (tgt > (lo + hi) / 2 ? 'upper' : 'lower') + ' half of what similar fests raised.') + '</div>' : '') + '</div>' +
    '<button class="btn primary mt16 ' + (canEdit() ? '' : 'off') + '" data-act="saveTarget">Save target</button>' + ro() + '</div>', { tab: 'home', nav: false, sticky: '' });

/* ---------- find sponsors ---------- */
const FDEF = { cat: 'all', cash: false, inkind: false, near: false, alumni: false, fresh: false, like: false, band: 'any' };
const getFilters = (f) => Object.assign({}, FDEF, (S.prefs[f.id] && S.prefs[f.id].filters) || {});
const setFilters = (f, patch) => { S.prefs[f.id] = S.prefs[f.id] || {}; S.prefs[f.id].filters = Object.assign(getFilters(f), patch); save(); render(); };
const inAnyList = (f, cid) => S.shortlists.some((s) => s.festId === f.id && s.companyIds.includes(cid));
function matchFilters(c, f, fl, q) {
  if (c.status !== 'verified') return false;
  if (q && !(c.name + ' ' + c.sub + ' ' + CAT_LABEL[c.cat] + ' ' + c.city).toLowerCase().includes(q.toLowerCase())) return false;
  if (fl.cat !== 'all' && c.cat !== fl.cat) return false;
  if (fl.cash && !c.tags.includes('Cash')) return false;
  if (fl.inkind && !c.tags.includes('In-kind')) return false;
  if (fl.near && c.city !== f.city) return false;
  if (fl.alumni && !alumniAt(c.id, f.college).length) return false;
  if (fl.fresh && freshness(c).key !== 'ok') return false;

  return '<div class="h2">Pitch request to ' + esc(c.name) + '</div><p class="note mt8">Goes to ' + esc(c.contact.name) + '’s inbox in a standard format with your proof pack.</p>' +
    fld('Your ask in rupees', inp('pitch.ask', { type: 'number', min: 0, rerender: true })) + fld('Message', txt('pitch.message', { rows: 6 })) +
    '<div class="card flat mt12">' + ck.map((x) => '<div class="row" style="gap:10px;padding:5px 0"><div class="ck ' + (x.ok ? 'done' : 'warn') + '" style="cursor:default;width:20px;height:20px">' + (x.ok ? ico('check', 12, '#FFFCF4', 3.2) : '<span class="sg" style="font-weight:800;font-size:11px;color:var(--amber)">!</span>') + '</div><div class="note f1" style="color:var(--ink)">' + x.text + '</div></div>').join('') + '</div>' +
    '<button class="btn primary mt16 ' + (f.status === 'verified' && canEdit() ? '' : 'off') + '" data-act="sendPitch">Send request</button>' + (f.status !== 'verified' ? '<p class="note mt8">Unlocks after your fest is verified.</p>' : '') + '<button class="btn ghost mt12" data-act="closeSheet">Cancel</button>';
};
ACT.sendPitch = () => {
  const f = myFest(), pt = ui.forms.pitch, c = C(pt.cid), u = me();
  if (SERVER) return serverDo('send_pitch', { p: { companyId: c.id, ask: +pt.ask || 0, message: pt.message.trim() } }, 'Pitch request sent to ' + c.name, () => { ui.sheet = null; render(); });
  if (c.inbound.paused) return toast(c.name + ' has paused new requests');
  const week = S.requests.filter((r) => r.companyId === c.id && r.createdAt > Date.now() - 7 * DAY).length;
  if (week >= c.inbound.weeklyCap) return toast(c.name + ' is at its weekly limit. Try again next week.');
  if (S.requests.some((r) => r.festId === f.id && r.companyId === c.id && ['new', 'question'].includes(r.status))) return toast('You already have an open request with ' + c.name);
  mutate(() => {
    const ask = +pt.ask || 0;
    S.requests.unshift({ id: uid('r'), festId: f.id, companyId: c.id, ask, message: pt.message.trim(), status: 'new', reason: '', createdAt: Date.now(), by: u.id });
    const p = stageOfFest(f.id, c.id) || addToPipeline(f, c.id, 'contacted', ask);
    if (['shortlisted', 'intro'].includes(p.stage)) p.stage = 'contacted';
    p.ask = ask; logAct(p, 'Sent a pitch request');
    notify(S.users.filter((x) => x.role === 'brand' && x.entityId === c.id).map((x) => x.id), f.name + ' sent a sponsorship request', '#/b/inbox');
    ui.sheet = null;
  });
  toast('Pitch request sent to ' + c.name);
};

/* ===== Fest side: pipeline, deals, alumni, profile, documents ===== */
const firstName = (n) => String(n).split(' ')[0];
function itemSub(p) {
  const c = C(p.companyId), owner = firstName(U(p.owner) ? U(p.owner).name : 'Team');
  const i = S.intros.filter((x) => x.festId === p.festId && x.companyId === p.companyId).sort((a, b) => b.createdAt - a.createdAt)[0];
  if (p.stage === 'intro' && i) {
    const al = A(i.alumnusId);
    if (i.status === 'accepted') return owner + ', ' + (p.deckSent ? 'deck sent' : 'intro accepted, deck due');
    if (i.status === 'declined') return owner + ', ' + firstName(al.name) + ' declined';
    if (i.status === 'redirected') return owner + ', ' + firstName(al.name) + ' suggested someone else';
    return owner + ', waiting ' + Math.max(0, daysSince(i.createdAt)) + ' days for ' + firstName(al.name);
  }
  if (p.stage === 'meeting' && p.meetingAt) return owner + ', ' + fmtDT(p.meetingAt);
  if (p.stage === 'committed') return owner + ', ' + money(p.amount) + (p.kind === 'in-kind' ? ' in-kind value' : ' cash');
  if (p.stage === 'declined') return owner + ', ' + (p.decline || 'declined');
  if (p.ask) return owner + ', asked ' + money(p.ask);
  return owner + ', last touch ' + agoText(p.lastTouch);
}
function itemPill(p) {
  const i = S.intros.filter((x) => x.festId === p.festId && x.companyId === p.companyId).sort((a, b) => b.createdAt - a.createdAt)[0];
  if (p.stage === 'intro' && i) return i.status === 'accepted' ? (p.deckSent ? pill('Deck sent', 'teal') : pill('Send deck', 'mari')) : i.status === 'declined' ? pill('Declined', 'brick') : i.status === 'redirected' ? pill('Redirected', 'amber') : pill(i.status === 'seen' ? 'Seen' : 'Waiting', 'ink');
  if (p.stage === 'meeting') return pill('Meeting', 'teal');
  if (p.stage === 'negotiating') return p.followUp && p.followUp <= Date.now() + DAY ? pill('Reply due', 'amber') : pill('Talking', 'mari');
  if (p.stage === 'committed') return pill('Signed', 'teal');
  if (p.stage === 'declined') return pill('Declined', 'brick');
  if (p.stage === 'replied') return pill('Replied', 'teal');
  if (p.stage === 'contacted') return pill('Contacted', 'ink');
  return pill('Shortlisted', 'ink');
}
function dupWarnings(f) {
  const me_ = S.session.userId;
  return festPipeline(f.id).filter((p) => p.owner !== me_ && ['contacted', 'replied', 'intro'].includes(p.stage) && inAnyList(f, p.companyId));
}

V.pipeline = () => {
  const f = myFest(), t = totals(f.id), tg = f.target || 0, flt = ui.view.pf || 'all';
  const all = festPipeline(f.id);
  const counts = STAGES.map((s) => [s[0], s[1] + ' ' + all.filter((p) => p.stage === s[0]).length]).filter((x) => all.some((p) => p.stage === x[0]));
  const shown = all.filter((p) => flt === 'all' ? true : flt === 'mine' ? p.owner === S.session.userId : p.stage === flt);
  const warn = dupWarnings(f);
  const groups = STAGES.map((s) => ({ s, items: shown.filter((p) => p.stage === s[0]) })).filter((g) => g.items.length);
  const comm = (g) => g.s[0] === 'committed' ? '<span class="cap">' + plural(g.items.length, 'deal', 'deals') + ', ' + money(g.items.reduce((a, p) => a + p.amount, 0)) + '</span>' : '<span class="cap">' + g.items.length + '</span>';
  return page('<div class="pad"><div class="row between mt12"><div class="h1">Pipeline</div><div class="stack">' + festUsers(f.id).slice(0, 4).map((m, i) => avatar(m.initials, ['', 'tl', 'bk', 'am'][i % 4])).join('') + '</div></div>' +
    '<div class="card mt16" style="padding:14px 16px"><div class="row between"><span class="cap">Confirmed</span><span class="sg" style="font-weight:700;font-size:14px">' + money(t.confirmed) + (tg ? ' of ' + money(tg) : '') + '</span></div><div class="bar mt12" style="height:9px"><i style="width:' + (tg ? Math.min(100, t.confirmed / tg * 100) : 0) + '%;background:var(--teal)"></i></div></div>' +
    (warn.length ? '<div class="banner amber"><div>' + ico('alert', 18, 'currentColor', 2) + '</div><div class="note"><b class="sg">Check before you write.</b> ' + esc(firstName(U(warn[0].owner).name)) + ' contacted ' + esc(C(warn[0].companyId).name) + ' on ' + fmtDate(warn[0].createdAt) + '.' + (warn.length > 1 ? ' ' + (warn.length - 1) + ' more like this.' : '') + '</div></div>' : '') +
    ro() +
    '<div class="mt12">' + chipRow([['all', 'All ' + all.length], ['mine', 'Mine']].concat(counts), flt, 'setPF') + '</div>' +
    (groups.length ? groups.map((g) => '<div class="row between" style="margin:18px 0 8px"><div class="sg" style="font-weight:700;font-size:14.5px">' + g.s[1] + '</div>' + comm(g) + '</div><div class="card" style="padding:6px 16px">' +
      g.items.map((p) => { const c = C(p.companyId); return '<a class="lr" href="#/' + (p.stage === 'committed' ? 'deal' : 'pipe') + '/' + p.id + '">' + logo(c, 'sm') + '<div class="t"><b>' + esc(c.name) + '</b><span>' + esc(itemSub(p)) + '</span></div>' + itemPill(p) + '</a>'; }).join('') + '</div>').join('')
      : '<div class="card mt16">' + empty('Nothing here yet', 'Find a sponsor and add it to your pipeline.', '<a class="btn primary sm" href="#/find">Find sponsors</a>') + '</div>') +
    '</div>', { tab: 'pipeline' });
};

  if (!p) return page(appbar('Conversation', { back: '#/pipeline' }) + empty('Not found', 'This item was removed.'), { tab: 'pipeline' });
  const c = C(p.companyId), ed = canEdit(), reveal = p.stage !== 'shortlisted';
  const i = S.intros.filter((x) => x.festId === f.id && x.companyId === c.id).sort((a, b) => b.createdAt - a.createdAt)[0];
  const members = festUsers(f.id).filter((m) => m.festRole !== 'convenor');

  return page(appbar(c.name, { back: '#/pipeline' }) + '<div class="pad">' +

    '<div class="card mt16"><div class="h3">Details</div>' +

    ctl('Your ask in rupees', '<input class="inp" type="number" min="0" value="' + (p.ask || '') + '" data-change="setAsk" data-id="' + p.id + '">', money(p.ask)) +
    ctl('Follow up on', '<input class="inp" type="date" value="' + toDateInput(p.followUp) + '" data-change="setFollow" data-id="' + p.id + '">', p.followUp ? fmtDateY(p.followUp) : 'Not set') +
    ctl('Meeting', '<input class="inp" type="datetime-local" value="' + toDTInput(p.meetingAt) + '" data-change="setMeeting" data-id="' + p.id + '">', p.meetingAt ? fmtDT(p.meetingAt) : 'Not booked') +

    '<div class="card mt16"><div class="cap">Contact</div><div class="row mt12">' + avatar(initials(c.contact.name)) + '<div><div class="sg" style="font-weight:600;font-size:15px">' + esc(c.contact.name) + '</div><div class="note">' + esc(c.contact.role) + '</div></div></div>' +

    '<div class="card mt16"><div class="h3">Notes</div>' + (ed ? '<div class="mt12">' + txt('note.text', { rows: 2 }) + '</div><button class="btn ghost sm mt8" data-act="addNote" data-id="' + p.id + '">Add note</button>' : '') +
    (p.notes.length ? '<div class="mt12">' + p.notes.map((n) => '<div class="kv" style="display:block"><div class="note" style="color:var(--ink)">' + esc(n.text) + '</div><div class="cap">' + esc(U(n.by) ? U(n.by).name : 'Team') + ', ' + agoText(n.ts) + '</div></div>').join('') + '</div>' : '<div class="note mt8">No notes yet.</div>') + '</div>' +
    '<div class="card mt16"><div class="h3">Activity</div><div class="mt12">' + (p.activity.length ? p.activity.map((a) => '<div class="kv" style="display:block"><div class="note" style="color:var(--ink)">' + esc(a.text) + '</div><div class="cap">' + esc(U(a.by) ? U(a.by).name : 'Team') + ', ' + agoText(a.ts) + '</div></div>').join('') : '<div class="note">Nothing logged.</div>') + '</div></div>' +
    (ed && p.stage !== 'committed' ? '<button class="btn danger mt16" data-act="removePipe" data-id="' + p.id + '">Remove from pipeline</button>' : '') + '</div>', { tab: 'pipeline', hdr: false });
};
const itemById = (el) => P(el.dataset.id);
ACT.setStage = (el) => {
  const p = itemById(el), v = el.value, f = myFest();
  if (v === p.stage) return;
  if (v === 'committed') { ui.forms.cm = { id: p.id, amount: String(p.ask || ''), kind: 'cash', split: 'half', later: toDateInput(ahead(60)), items: { banner: true, stall: true, social: true, mention: false, report: true } }; render(); return openSheet('commit', {});
  }
  if (v === 'declined') { ui.forms.dc = { id: p.id, reason: DECLINE_REASONS[0] }; render(); return openSheet('decline', {}); }
  mutate(() => { p.stage = v; logAct(p, 'Moved to ' + STAGE_LABEL[v]); });
  toast('Moved to ' + STAGE_LABEL[v]);
};
ACT.setOwner = (el) => { const p = itemById(el); mutate(() => { p.owner = el.value; logAct(p, 'Owner changed to ' + U(el.value).name); }); };
ACT.setAsk = (el) => { const p = itemById(el); mutate(() => { p.ask = Math.max(0, +el.value || 0); logAct(p, 'Ask set to ' + money(p.ask)); }); };
ACT.setFollow = (el) => { const p = itemById(el); mutate(() => { p.followUp = fromDateInput(el.value); logAct(p, p.followUp ? 'Follow-up set for ' + fmtDate(p.followUp) : 'Follow-up cleared'); }); };
ACT.setMeeting = (el) => { const p = itemById(el); mutate(() => { p.meetingAt = fromDTInput(el.value); if (p.meetingAt && ['shortlisted', 'intro', 'contacted', 'replied'].includes(p.stage)) p.stage = 'meeting'; logAct(p, p.meetingAt ? 'Meeting booked for ' + fmtDT(p.meetingAt) : 'Meeting cleared'); }); };
ACT.logContact = (el) => { const p = itemById(el); mutate(() => { logAct(p, 'Logged a contact'); if (p.stage === 'shortlisted') p.stage = 'contacted'; }); toast('Logged'); };
ACT.deckSent = (el) => { const p = itemById(el); mutate(() => { p.deckSent = true; logAct(p, 'Deck sent after the introduction'); }); toast('Marked as sent'); };
ACT.addNote = (el) => { const p = itemById(el), t = (fv('note.text') || '').trim(); if (!t) return toast('Write a note first'); mutate(() => { p.notes.unshift({ id: uid('nt'), ts: Date.now(), by: S.session.userId, text: t }); logAct(p, 'Added a note'); ui.forms.note = { text: '' }; }); };
ACT.removePipe = (el) => { const p = itemById(el); mutate(() => { S.pipeline = S.pipeline.filter((x) => x.id !== p.id); }); toast('Removed'); go('#/pipeline'); };

SHEETS.decline = () => {
  const p = P(ui.forms.dc.id), c = C(p.companyId);
  return '<div class="h2">Why did ' + esc(c.name) + ' decline?</div><p class="note mt8">Patterns in the reasons show where to change the pitch.</p>' + fld('Reason', sel('dc.reason', DECLINE_REASONS)) +
    '<button class="btn primary mt20" data-act="confirmDecline">Save</button><button class="btn ghost mt12" data-act="closeSheet">Cancel</button>';
};
ACT.confirmDecline = () => { const d = ui.forms.dc, p = P(d.id); mutate(() => { p.stage = 'declined'; p.decline = d.reason; logAct(p, 'Declined: ' + d.reason.toLowerCase()); ui.sheet = null; }); toast('Recorded'); };
const DELIV_PRESETS = [['banner', 'Logo on main stage banner'], ['stall', 'Stall space, 10 by 10 ft'], ['social', 'Three social posts'], ['mention', 'Stage mention at every show'], ['report', 'Sponsor report']];
SHEETS.commit = () => {
  const cm = ui.forms.cm, p = P(cm.id), c = C(p.companyId);
  return '<div class="h2">Record the deal with ' + esc(c.name) + '</div><p class="note mt8">Written commitments protect both sides. This is a record, not a payment: money moves directly between you and the sponsor.</p>' +
    fld('Amount in rupees (or in-kind value)', inp('cm.amount', { type: 'number', min: 0 })) + fld('Type', sel('cm.kind', [['cash', 'Cash'], ['in-kind', 'In-kind']], { rerender: true })) +
    (cm.kind === 'cash' ? fld('Payment plan', sel('cm.split', [['full', 'Full amount on signing'], ['half', '50 percent on signing, 50 percent later'], ['later', 'Full amount later']], { rerender: true })) + (cm.split !== 'full' ? fld('Later payment due', inp('cm.later', { type: 'date' })) : '') : '') +
    '<div class="cap mt16">What the fest promises</div><div class="mt8">' + DELIV_PRESETS.map((d) => '<div class="lr" data-act="cmItem" data-k="' + d[0] + '" style="padding:10px 0"><div class="ck ' + (cm.items[d[0]] ? 'done' : '') + '">' + (cm.items[d[0]] ? ico('check', 14, '#FFFCF4', 3.2) : '') + '</div><div class="t"><b style="font-weight:500">' + d[1] + '</b></div></div>').join('') + '</div>' +
    '<button class="btn primary mt16" data-act="saveCommit">Save commitment</button><button class="btn ghost mt12" data-act="closeSheet">Cancel</button>';
};
ACT.cmItem = (el) => { const cm = ui.forms.cm; cm.items[el.dataset.k] = !cm.items[el.dataset.k]; render(); };
ACT.saveCommit = () => {
  const cm = ui.forms.cm, p = P(cm.id), f = myFest(), amt = +cm.amount;
  if (!(amt > 0)) return toast('Enter the amount');
  const names = Object.fromEntries(DELIV_PRESETS);
  mutate(() => {
    p.stage = 'committed'; p.amount = amt; p.ask = amt; p.kind = cm.kind; p.committedOn = Date.now();
    p.payments = [];
    if (cm.kind === 'cash') {
      const later = fromDateInput(cm.later) || ahead(60);
      if (cm.split === 'full') p.payments.push({ id: uid('pay'), label: 'On signing', amount: amt, due: Date.now(), paid: false });
      else if (cm.split === 'half') { p.payments.push({ id: uid('pay'), label: 'On signing', amount: Math.round(amt / 2), due: Date.now(), paid: false }); p.payments.push({ id: uid('pay'), label: 'Second instalment', amount: amt - Math.round(amt / 2), due: later, paid: false }); }
      else p.payments.push({ id: uid('pay'), label: 'Payment', amount: amt, due: later, paid: false });
    }
    p.deliverables = DELIV_PRESETS.filter((d) => cm.items[d[0]]).map((d) => ({ id: uid('dl'), text: names[d[0]], done: false, owner: firstName(U(p.owner).name), due: d[0] === 'report' ? f.start + 7 * DAY : f.start - 5 * DAY, sub: '', count: d[0] === 'social' ? { done: 0, total: 3 } : undefined }));
    logAct(p, 'Commitment recorded: ' + money(amt) + (cm.kind === 'cash' ? ' cash' : ' in-kind value')); ui.sheet = null;
  });
  toast('Commitment recorded'); go('#/deal/' + p.id);
};

/* ---------- deal record ---------- */

  return page(appbar('Deal record', { back: '#/pipeline' }) + '<div class="pad">' +

    '<div class="big mt16">' + money(p.amount) + '</div><div class="cap">' + (p.kind === 'in-kind' ? 'In-kind value, delivered at the fest' : 'Cash, ' + plural(p.payments.length, 'payment', 'payments')) + '</div>' +

  const dups = dupGroups();
  const missing = S.companies.filter((c) => c.status !== 'rejected' && (!c.contact.email || !c.contact.name || !c.city));
  const block = (title, items, empty_) => '<div class="card mt12"><div class="row between"><div class="h3">' + title + '</div>' + pill(String(items.length), items.length ? 'amber' : 'teal') + '</div>' + (items.length ? '<div class="mt8">' + items.join('') + '</div>' : '<div class="note mt8">' + empty_ + '</div>') + '</div>';
  return page('<div class="pad"><div class="h1 mt12">Data quality</div><p class="note mt8">Quality is monitored, not assumed. These checks run every time you open this page.</p>' +
    block('Bounced contacts', bounced.map((c) => '<div class="lr" style="padding:10px 0">' + logo(c, 'sm') + '<div class="t"><b>' + esc(c.name) + '</b><span>' + esc(c.contact.email) + '</span></div><a class="pill mari" href="#/ad/verify">Fix</a></div>'), 'No bounced contacts.') +
    block('Contacts overdue by more than 90 days', overdue.map((c) => '<div class="lr" style="padding:10px 0">' + logo(c, 'sm') + '<div class="t"><b>' + esc(c.name) + '</b><span>' + daysSince(c.verifiedOn) + ' days since the last check</span></div><a class="pill mari" href="#/ad/verify">Re-check</a></div>'), 'Every verified contact was checked in the last 90 days.') +
    block('Possible duplicate companies', dups.map((g) => '<div class="lr" style="padding:10px 0"><div class="t"><b>' + g.map((c) => esc(c.name)).join(' and ') + '</b><span>' + g.map((c) => c.status).join(', ') + '</span></div><button class="pill mari" style="border:none;cursor:pointer" data-act="adMerge" data-ids="' + g.map((c) => c.id).join(',') + '">Merge</button></div>'), 'No duplicates found.') +
    block('Missing fields', missing.map((c) => '<div class="lr" style="padding:10px 0">' + logo(c, 'sm') + '<div class="t"><b>' + esc(c.name) + '</b><span>Missing contact name, email or city</span></div></div>'), 'Every listing has a contact name, email and city.') + '</div>', { tab: 'quality' });
};
ACT.adMerge = (el) => {
  const ids = el.dataset.ids.split(','), cs = ids.map(C);
  const keep = cs.find((c) => c.status === 'verified') || cs[0], drop = cs.filter((c) => c !== keep);
  if (SERVER) return (async () => { for (const d of drop) { await serverDo('merge_companies', { p: { keepId: keep.id, dropId: d.id } }, null); } toast('Merged into ' + keep.name); })();
  mutate(() => {
    drop.forEach((d) => {
      S.pipeline.forEach((p) => { if (p.companyId === d.id) p.companyId = keep.id; });
      S.shortlists.forEach((s) => { s.companyIds = s.companyIds.map((x) => (x === d.id ? keep.id : x)).filter((x, i, a) => a.indexOf(x) === i); });
      S.requests.forEach((r) => { if (r.companyId === d.id) r.companyId = keep.id; });
      S.alumni.forEach((a) => { if (a.companyId === d.id) a.companyId = keep.id; });
      S.users.forEach((u) => { if (u.role === 'brand' && u.entityId === d.id) u.entityId = keep.id; });
      S.companies = S.companies.filter((x) => x.id !== d.id);
      logAudit('Merged duplicate ' + d.name + ' into ' + keep.name);
    });
  });
  toast('Merged into ' + keep.name);
};

/* ---------- reports ---------- */
V['ad/reports'] = () => {
  const flt = ui.view.rf || 'open', list = S.reports.filter((r) => (flt === 'all' ? true : r.status === flt));
  const tname = (r) => (r.targetType === 'fest' ? (F(r.targetId) || {}).name : r.targetType === 'company' ? (C(r.targetId) || {}).name : r.targetId);
  return page('<div class="pad"><div class="h1 mt12">Reports</div><p class="note mt8">Reports from fests, brands and alumni.</p><div class="mt12">' + chipRow([['open', 'Open ' + S.reports.filter((r) => r.status === 'open').length], ['resolved', 'Resolved'], ['all', 'All']], flt, 'setRF') + '</div>' +
    (list.length ? list.map((r) => '<div class="card mt12"><div class="row between top"><div class="f1"><div class="h3" style="font-size:15.5px">' + esc(r.kind) + ': ' + esc(tname(r)) + '</div><div class="cap">' + esc((U(r.by) || { name: 'Someone' }).name) + ', ' + agoText(r.ts) + '</div></div>' + pill(r.status === 'open' ? 'Open' : 'Resolved', r.status === 'open' ? 'amber' : 'teal') + '</div><p class="note mt8" style="color:var(--ink)">' + esc(r.text) + '</p>' +
      (r.status === 'open' ? '<div class="row mt12 wrap"><button class="btn primary sm" data-act="rpResolve" data-id="' + r.id + '">Resolve</button>' + (r.targetType === 'company' ? '<button class="btn ghost sm" data-act="rpAction" data-id="' + r.id + '">Mark contact bounced</button>' : r.targetType === 'fest' ? '<button class="btn danger sm" data-act="rpAction" data-id="' + r.id + '">Suspend listing</button>' : '') + '</div>' : '') + '</div>').join('') : '<div class="card mt12">' + empty('No reports', 'Nothing to review.') + '</div>') + '</div>', { tab: 'reports' });
};
ACT.setRF = (el) => { ui.view.rf = el.dataset.v; render(); };
ACT.rpResolve = (el) => { const r = byId(S.reports, el.dataset.id); if (SERVER) return serverDo('report_action', { p: { reportId: r.id, action: 'resolve' } }, 'Resolved'); mutate(() => { r.status = 'resolved'; logAudit('Resolved report: ' + r.kind); notify([r.by], 'Your report was reviewed: ' + r.kind, ''); }); toast('Resolved'); };
ACT.rpAction = (el) => {
  const r = byId(S.reports, el.dataset.id);
  if (SERVER) return serverDo('report_action', { p: { reportId: r.id, action: r.targetType === 'company' ? 'bounce' : 'suspend' } }, 'Done');
  mutate(() => {
    if (r.targetType === 'company') { C(r.targetId).status = 'bounced'; logAudit('Marked ' + C(r.targetId).name + ' contact as bounced after a report'); }
    else { F(r.targetId).status = 'rejected'; logAudit('Suspended fest listing ' + F(r.targetId).name + ' after a report'); }
    r.status = 'resolved'; notify([r.by], 'Thanks. We acted on your report: ' + r.kind, '');
  });
  toast('Done');
};

/* ---------- insights ---------- */
V['ad/insights'] = () => {
  const rq = S.requests, answered = rq.filter((r) => r.status !== 'new').length, intros = S.intros, accepted = intros.filter((i) => i.status === 'accepted').length;
  const deals = S.pipeline.filter((p) => p.stage === 'committed'), value = deals.reduce((a, p) => a + p.amount, 0);
  const verifiedC = S.companies.filter((c) => c.status === 'verified'), ages = verifiedC.map((c) => daysSince(c.verifiedOn));
  const avg = ages.length ? Math.round(ages.reduce((a, b) => a + b, 0) / ages.length) : 0;
  const m = (v, l) => '<div class="metric"><b>' + v + '</b><span class="cap">' + l + '</span></div>';
  const pct = (a, b) => (b ? Math.round(a / b * 100) + '%' : 'n/a');
  const stageRows = STAGES.map((s) => [s[1], S.pipeline.filter((p) => p.stage === s[0]).length]);
  const mx = Math.max(1, ...stageRows.map((x) => x[1]));
  return page('<div class="pad"><div class="h1 mt12">Insights</div><p class="note mt8">How the product is doing against the success measures.</p>' +
    '<div class="row wrap mt16">' + m(S.fests.filter((f) => f.status === 'verified').length + '/' + S.fests.length, 'Fests verified') + m(verifiedC.length, 'Brands listed') + m(S.alumni.filter((a) => a.status === 'verified').length, 'Alumni verified') + '</div>' +
    '<div class="row wrap mt12">' + m(rq.length, 'Pitch requests sent') + m(pct(answered, rq.length), 'Brand response rate') + m(pct(accepted, intros.length), 'Intro acceptance') + '</div>' +
    '<div class="row wrap mt12">' + m(deals.length, 'Deals closed') + m(money(value), 'Value committed') + m(adminQueue().length, 'Verification backlog') + m(avg + ' days', 'Average contact age') + '</div>' +
    (SERVER ? benchCard() : '') +
    '<div class="card mt16"><div class="h3">Conversations by stage</div><div class="mt12">' + stageRows.map((x) => '<div class="mt8"><div class="row between"><span class="note" style="color:var(--ink)">' + x[0] + '</span><b class="sg" style="font-size:13px">' + x[1] + '</b></div><div class="rbar mt8" style="height:8px"><i style="left:0;width:' + x[1] / mx * 100 + '%"></i></div></div>').join('') + '</div></div></div>', { tab: 'insights' });
};

/* ---------- audit log ---------- */
V['ad/log'] = () => page('<div class="pad"><div class="h1 mt12">Audit log</div><p class="note mt8">Who changed what, and when.</p><div class="card mt12" style="padding:6px 16px">' +
  (S.audit.length ? S.audit.slice(0, 60).map((a) => '<div class="lr"><div class="t"><b style="font-weight:600">' + esc(a.text) + '</b><span>' + esc((U(a.by) || { name: 'System' }).name) + ', ' + fmtDateY(a.ts) + '</span></div></div>').join('') : empty('Nothing yet', '')) + '</div></div>', { tab: 'log' });

/* ---------- add a company by hand, and benchmarks entered by the desk ---------- */
ACT.adAddCompany = () => { ui.forms.ac = { name: '', sub: '', cat: 'tech', city: '', band: 'Under 1L', cn: '', cr: '', ce: '', ch: 'Email', rd: '5', lo: '', hi: '', n: '', method: 'Phone call to the contact', tags: ['Cash'] }; openSheet('adCompany'); };
SHEETS.adCompany = () => '<div class="h2">Add a company</div><p class="note mt8">For brands you have spoken to yourself. It goes live as verified, so log how you checked.</p>' +
  fld('Company', inp('ac.name')) + fld('What they do', inp('ac.sub', { ph: 'Cloud and developer tools' })) + fld('Category', sel('ac.cat', CATS.filter((c) => !c.tier).map((c) => [c.k, c.label]))) + fld('City', inp('ac.city')) +
  '<div class="cap mt12">What they can offer</div><div class="row wrap g8 mt8">' + ['Cash', 'In-kind', 'Hiring', 'Prizes', 'Stalls'].map((t) => '<button class="chip ' + (ui.forms.ac.tags.includes(t) ? 'on' : '') + '" data-act="acTag" data-v="' + t + '">' + t + '</button>').join('') + '</div>' +
  fld('Typical budget', sel('ac.band', ['Under 1L', '1L to 3L', '3L+'])) + fld('Contact name', inp('ac.cn')) + fld('Contact role', inp('ac.cr', { ph: 'Campus Marketing Lead' })) + fld('Contact email', inp('ac.ce', { type: 'email' })) +
  fld('Preferred channel', sel('ac.ch', ['Email', 'WhatsApp', 'LinkedIn', 'Phone'])) + fld('Usually replies in (days)', inp('ac.rd', { type: 'number', min: 1 })) +
  '<div class="cap mt16">What similar fests gave them, from your interviews (lakhs). Leave blank if unknown.</div><div class="row g8 mt8"><div class="f1">' + inp('ac.lo', { type: 'number', ph: 'Low' }) + '</div><div class="f1">' + inp('ac.hi', { type: 'number', ph: 'High' }) + '</div><div class="f1">' + inp('ac.n', { type: 'number', ph: 'Fests' }) + '</div></div>' +
  fld('How did you check', sel('ac.method', VERIFY_METHODS.company)) + '<button class="btn primary mt20" data-act="adCompanyGo">Add company</button><button class="btn ghost mt12" data-act="closeSheet">Cancel</button>';
ACT.acTag = (el) => { const t = ui.forms.ac.tags, v = el.dataset.v; ui.forms.ac.tags = t.includes(v) ? t.filter((x) => x !== v) : t.concat([v]); render(); };
ACT.adCompanyGo = () => {
  const a = ui.forms.ac;
  if (!need(a, ['name', 'city', 'cn', 'ce']) || !a.tags.length) return toast('Add the name, city, contact and email');
  if (SERVER) return serverDo('admin_add_company', { p: { name: a.name, sub: a.sub, cat: a.cat, city: a.city, tags: a.tags, band: a.band, contactName: a.cn, contactRole: a.cr, email: a.ce, channel: a.ch, replyDays: +a.rd || 5, benchLo: +a.lo || 0, benchHi: +a.hi || 0, benchN: +a.n || 0, method: a.method, color: COLORS[Math.floor(Math.random() * COLORS.length)] } }, 'Company added and verified', () => { ui.sheet = null; render(); });
  mutate(() => {
    S.companies.push({ id: uid('c_'), name: a.name.trim(), sub: a.sub.trim() || 'Company', cat: a.cat, city: a.city.trim(), tags: a.tags, band: a.band, color: COLORS[S.companies.length % COLORS.length], contact: { name: a.cn.trim(), role: a.cr.trim() || 'Contact', email: a.ce.trim(), channel: a.ch, replyDays: +a.rd || 5 }, verifiedOn: Date.now(), status: 'verified', bench: { lo: +a.lo || 0, hi: +a.hi || 0, n: +a.n || 0 }, past: [], inbound: { paused: false, weeklyCap: 6, types: FEST_TYPES.slice() }, visible: { email: false, band: true } });
    logAudit('Added company ' + a.name.trim()); ui.sheet = null;
  });
  toast('Company added and verified');
};
function benchCard() {
  const rows = Object.values(S.benchmarks || {}).sort((x, y) => (x.type + x.size + x.cat).localeCompare(y.type + y.size + y.cat));
  return '<div class="card mt16"><div class="row between"><div class="h3">Benchmarks</div><button class="btn ghost sm" data-act="adBench">Add or update</button></div><p class="note mt8">Ranges students see in the target planner. Enter what you learn from fest leads. Until a row has enough fests behind it, students see “Not enough data yet”.</p>' +
    (rows.length ? '<div class="mt8">' + rows.map((b) => '<div class="kv"><span>' + esc(b.type) + ', ' + esc((SIZE_BANDS.find((s) => s.k === b.size) || {}).label || b.size) + ', ' + esc(b.cat === 'total' ? 'Total raised' : CAT_LABEL[b.cat]) + '</span><b>' + lk(b.lo) + ' to ' + lk(b.hi) + ' (' + b.n + ')</b></div>').join('') + '</div>' : '<div class="note mt8">No benchmarks yet.</div>') + '</div>';
}
ACT.adBench = () => { ui.forms.bm = { type: 'Technical', size: 'm', cat: 'total', lo: '', hi: '', n: '' }; openSheet('adBench'); };
SHEETS.adBench = () => '<div class="h2">Set a benchmark</div><p class="note mt8">Amounts are in lakhs. “Fests” is how many real fests the range is based on.</p>' +
  fld('Fest type', sel('bm.type', FEST_TYPES)) + fld('Size', sel('bm.size', SIZE_BANDS.map((s) => [s.k, s.label]))) + fld('Sponsor type', sel('bm.cat', [['total', 'Total raised']].concat(CATS.map((c) => [c.k, c.label])))) +
  '<div class="row g8"><div class="f1">' + fld('Low', inp('bm.lo', { type: 'number', min: 0 })) + '</div><div class="f1">' + fld('High', inp('bm.hi', { type: 'number', min: 0 })) + '</div><div class="f1">' + fld('Fests', inp('bm.n', { type: 'number', min: 0 })) + '</div></div>' +
  '<button class="btn primary mt20" data-act="adBenchGo">Save</button><button class="btn ghost mt12" data-act="closeSheet">Cancel</button>';
ACT.adBenchGo = () => {
  const b = ui.forms.bm;
  if (!(+b.hi > 0) || +b.lo > +b.hi || !(+b.n > 0)) return toast('Enter a low and high figure and how many fests');
  serverDo('admin_set_benchmark', { p: { type: b.type, size: b.size, cat: b.cat, lo: +b.lo, hi: +b.hi, n: +b.n } }, 'Benchmark saved', () => { ui.sheet = null; render(); });
};

/* ===== Router hooks and boot ===== */
function onRoute() {
  const u = me(), r = currentRoute();
  if (u && u.role === 'alumni' && r.name === 'a' && r.a === 'inbox') {
    if (SERVER) {
      if (S.intros.some((i) => i.alumnusId === u.entityId && i.status === 'sent')) rpcCall('mark_intros_seen').then(() => refresh(true)).catch(() => {});
    } else {
      let changed = false;
      S.intros.forEach((i) => { if (i.alumnusId === u.entityId && i.status === 'sent') { i.status = 'seen'; changed = true; } });
      if (changed) save();
    }
  }
  render();
  window.scrollTo(0, 0);
}
(function boot() {
  const root = document.getElementById('app');
  if (!root) return;
  if (SERVER) { initServer(); return; }
  if (DEMO_OK) save();
  onRoute();
})();

</script>
